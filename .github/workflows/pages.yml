name: Viewer

# Publishes viewer/ to GitHub Pages. Turn Pages on once: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main, master]
    paths: [viewer/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v5
